name: macOS

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Build and publish Apple Silicon release' || 'Build Boxer for Apple Silicon' }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Patch shader dependencies for current CMake
        run: |
          if ! grep -q CMAKE_POLICY_VERSION_MINIMUM Vendor/OpenEmuShaders/3rdparty/Makefile; then
            perl -0pi -e 's/\$\(CMAKE\) -B \$\(GLSLANG_BUILD_DIR\) -S \$\(GLSLANG_DIR\)/\$(CMAKE) -B \$(GLSLANG_BUILD_DIR) -S \$(GLSLANG_DIR) -DCMAKE_POLICY_VERSION_MINIMUM=3.5/' Vendor/OpenEmuShaders/3rdparty/Makefile
            perl -0pi -e 's/\$\(CMAKE\) -B \$\(SPIRV_TOOLS_BUILD_DIR\) -S \$\(SPIRV_TOOLS_DIR\) -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES='\''\$\(TARGET_ARCHITECTURES\)'\'' -DSPIRV_WERROR=OFF/\$(CMAKE) -B \$(SPIRV_TOOLS_BUILD_DIR) -S \$(SPIRV_TOOLS_DIR) -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES='\''\$(TARGET_ARCHITECTURES)\'\'' -DSPIRV_WERROR=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5/' Vendor/OpenEmuShaders/3rdparty/Makefile
          fi

      - name: Configure version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="2.0.0-Beta1"
          fi
          DATE=$(date +%Y%m%d)
          echo "Building Boxer version ${VERSION} (${DATE}) from tag ${TAG}"
          perl -0pi -e "s/MARKETING_VERSION: .*/MARKETING_VERSION: ${VERSION}/g" project.yml
          perl -0pi -e "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${VERSION}+${DATE}/g" project.yml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('GITHUB_REF_NAME', '')
          version = tag[1:] if tag.startswith('v') else tag
          if not version:
              version = os.environ.get('VERSION', '2.0.0-Beta1')
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          en_pattern = rf'## Version {re.escape(version)} \(English\)(.*?)(?:\r?\n##\s|\r?\n---\r?\n|\Z)'
          en_match = re.search(en_pattern, content, re.DOTALL)
          en_notes = en_match.group(1).strip() if en_match else ''
          zh_pattern = rf'## 版本 {re.escape(version)} \(中文\)(.*?)(?:\r?\n##\s|\r?\n---|\Z)'
          zh_match = re.search(zh_pattern, content, re.DOTALL)
          zh_notes = zh_match.group(1).strip() if zh_match else ''
          release_notes = ''
          if en_notes:
              release_notes += f'## Version {version} (English)\n\n' + en_notes + '\n\n'
          if en_notes and zh_notes:
              release_notes += '---\n\n'
          if zh_notes:
              release_notes += f'## 版本 {version} (中文)\n\n' + zh_notes + '\n'
          if not release_notes:
              release_notes = f'## Release {tag}\n\nBoxer release {tag}.\n'
          if not en_notes:
              en_notes = release_notes
          if not zh_notes:
              zh_notes = release_notes
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(release_notes)
          with open('release_notes_en.md', 'w', encoding='utf-8') as f:
              f.write(en_notes)
          with open('release_notes_zh.md', 'w', encoding='utf-8') as f:
              f.write(zh_notes)
          "

      - name: Build release apps
        run: |
          # Build Boxer
          xcodebuild \
            -project Boxer.xcodeproj \
            -scheme Boxer \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

          # Build Boxer Standalone
          xcodebuild \
            -project Boxer.xcodeproj \
            -scheme "Boxer Standalone" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

          # Build Boxer Bundler
          xcodebuild \
            -project Boxer.xcodeproj \
            -scheme "Boxer Bundler" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Package release apps
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ env.VERSION }}"
          if [ -z "$VERSION" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="2.0.0-Beta1"
          fi

          # Ensure deep ad-hoc signing for all apps and embedded frameworks
          codesign --force --deep --sign - "build/Build/Products/Release/Boxer.app"
          codesign --force --deep --sign - "build/Build/Products/Release/Boxer Standalone.app"
          codesign --force --deep --sign - "build/Build/Products/Release/Boxer Bundler.app"

          # Package Boxer
          ditto -c -k --keepParent "build/Build/Products/Release/Boxer.app" "Boxer-${VERSION}-arm64.zip"
          hdiutil create -volname Boxer -srcfolder "build/Build/Products/Release/Boxer.app" -ov -format UDZO "Boxer-${VERSION}-arm64.dmg"

          # Package Boxer Standalone
          ditto -c -k --keepParent "build/Build/Products/Release/Boxer Standalone.app" "Boxer-Standalone-${VERSION}-arm64.zip"
          hdiutil create -volname "Boxer Standalone" -srcfolder "build/Build/Products/Release/Boxer Standalone.app" -ov -format UDZO "Boxer-Standalone-${VERSION}-arm64.dmg"

          # Package Boxer Bundler
          ditto -c -k --keepParent "build/Build/Products/Release/Boxer Bundler.app" "Boxer-Bundler-${VERSION}-arm64.zip"
          hdiutil create -volname "Boxer Bundler" -srcfolder "build/Build/Products/Release/Boxer Bundler.app" -ov -format UDZO "Boxer-Bundler-${VERSION}-arm64.dmg"

      - name: Generate Sparkle Appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          if [ -z "$VERSION" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="2.0.0-Beta1"
          fi

          # 1. 获取最新 Sparkle 版本并下载工具
          SPARKLE_VERSION=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq '.tag_name' | sed 's/^v//')
          curl -fL -H "User-Agent: curl" -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf Sparkle.tar.xz

          # 2. 极致清理私钥 (确保没有任何不可见字符)
          CLEAN_KEY=$(echo "$SPARKLE_SECRET" | sed 's/EdDSAPrivateKey://' | tr -dc 'A-Za-z0-9+/=')
          
          if [ -z "$CLEAN_KEY" ]; then
            echo "ERROR: SPARKLE_PRIVATE_KEY secret is missing!"
            exit 1
          fi

          # 3. 准备发布目录
          mkdir -p deploy
          cp Boxer-${VERSION}-arm64.zip deploy/
          # 准备多语言更新日志文件
          cp release_notes_en.md "deploy/release_notes_en.md"
          cp release_notes_zh.md "deploy/release_notes_zh.md"
          # 默认版本（供 generate_appcast 自动创建基础项）
          cp release_notes_en.md "deploy/release_notes.md"
          
          # 4. 执行签名并生成 Appcast
          # 设置动态库路径以确保 bin/generate_appcast 能找到 Sparkle.framework
          export DYLD_FRAMEWORK_PATH="$PWD"
          
          echo "Running generate_appcast using stdin method..."
          echo "$CLEAN_KEY" | ./bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/SteveShi/Boxer/releases/download/${{ github.ref_name }}/" \
            deploy/
          
          if [ -f "deploy/appcast.xml" ]; then
            mv deploy/appcast.xml .
            
            # 1. 清理可能自动生成的描述或旧链接 (MacOS BSD sed 语法适配)
            sed -i.bak '/<description>/d' appcast.xml
            sed -i.bak '/<sparkle:releaseNotesLink>/d' appcast.xml
            
            # 2. 准备链接内容
            EN_LINK="https://github.com/SteveShi/Boxer/releases/download/${{ github.ref_name }}/release_notes_en.md"
            ZH_LINK="https://github.com/SteveShi/Boxer/releases/download/${{ github.ref_name }}/release_notes_zh.md"
            
            # 3. 注入Localized链接（在 <enclosure 标签之前）
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"en\">$EN_LINK</sparkle:releaseNotesLink>" appcast.xml
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"zh-Hans\">$ZH_LINK</sparkle:releaseNotesLink>" appcast.xml
            
            rm appcast.xml.bak
            echo "Appcast generated successfully with localized Markdown support."
          else
            echo "ERROR: generate_appcast failed to produce appcast.xml."
            exit 1
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            Boxer-*-arm64.zip
            Boxer-*-arm64.dmg
            Boxer-Standalone-*-arm64.zip
            Boxer-Standalone-*-arm64.dmg
            Boxer-Bundler-*-arm64.zip
            Boxer-Bundler-*-arm64.dmg
            release_notes_en.md
            release_notes_zh.md
            appcast.xml
          fail_on_unmatched_files: true
          make_latest: true
